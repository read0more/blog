# 의존성 자동 업데이트 — CI(deploy.yml)가 생성된 PR을 자동 검증한다.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5 # 동시에 열리는 PR 수 상한
    # ESLint 10 메이저는 막아둔다. eslint-config-next(16.2.9)가 번들한
    # eslint-plugin-react 가 ESLint 10 에서 제거된 getFilename API 를 호출해
    # `react/display-name` 룰 로딩에서 크래시한다(최신 7.37.5 도 peer 가 eslint ^9.7
    # 까지). Next.js 린트 스택이 ESLint 10 을 지원하면 이 ignore 를 제거한다.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    # react 계열은 항상 같은 버전이어야 한다(peer 의존성). 따로 PR로 쪼개지면
    # 한쪽만 올라가 npm ci 가 ERESOLVE 로 깨진다 — 한 PR로 묶어 함께 업데이트.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
