<svg xmlns="http://www.w3.org/2000/svg" width="960" height="664" viewBox="0 0 960 664" role="img" aria-labelledby="title desc">
<title id="title">180px 열림을 새 스크롤 시작점으로 바꾸기</title><desc id="desc">제한 전에는 stage top 800, scrollTop 236에서 시트가 180px 보인다. stage top을 564로 바꾸고 scrollTop을 0으로 되돌리면 같은 모습이 유지된다. 새 스크롤 범위는 0부터 564이며 시작점에서도 시트 180px이 남는다.</desc>
