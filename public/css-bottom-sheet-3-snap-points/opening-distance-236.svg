<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
<title id="title">180px을 보여 주기 위한 스크롤 236px</title><desc id="desc">완전히 펼친 시트는 화면 위에 56px 여백을 남긴다. 닫힌 시트를 열 때는 먼저 그 56px을 지나온 뒤 180px을 더 올려야 한다. 총 스크롤은 236px이다.</desc>
<defs><clipPath id="full"><rect x="52" y="156" width="240" height="320" rx="8"/></clipPath><clipPath id="partial"><rect x="516" y="156" width="240" height="320" rx="8"/></clipPath></defs>
<rect x="1" y="1" width="958" height="658" fill="#f7faf6" rx="12" stroke="#cbd8cf" stroke-width="2"/>
<g font-family="-apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="32" y="47" font-size="28" fill="#193436" font-weight="700">180px을 보여 주려면, 왜 236px을 스크롤할까?</text><text x="32" y="80" font-size="19" fill="#52696a">화면 800px · 시트 744px · iOS 보정 0px</text><text x="52" y="125" font-size="24" fill="#193436" font-weight="700">다 펼쳤을 때</text><text x="516" y="125" font-size="24" fill="#193436" font-weight="700">180px만 열 때</text><g clip-path="url(#full)"><rect x="52" y="156" width="240" height="320" fill="#deeadb" rx="0"/><path d="M52 216L292 316M52 346L292 446M132 156L52 476M292 156L212 476" stroke="#f7f9f0" stroke-width="18"/><rect x="64" y="178.4" width="216" height="297.6" fill="#fffefb" rx="12" stroke="#176b5c" stroke-width="2"/><path d="M76 178.4H268Q280 178.4 280 190.4V250.4H64V190.4Q64 178.4 76 178.4Z" fill="#ffdfb2"/><rect x="150.0" y="190.4" width="44" height="4" fill="#92aaa0" rx="2"/><text x="80" y="226.4" font-size="22" fill="#193436" font-weight="700">주변 장소</text><path d="M64 250.4H280" stroke="#ad4b25" stroke-width="2"/><path d="M80 288.4H245" stroke="#bfcec4" stroke-width="6"/><path d="M80 324.4H220" stroke="#bfcec4" stroke-width="6"/><path d="M80 360.4H245" stroke="#bfcec4" stroke-width="6"/><path d="M80 396.4H220" stroke="#bfcec4" stroke-width="6"/><path d="M80 432.4H245" stroke="#bfcec4" stroke-width="6"/></g><rect x="52" y="156" width="240" height="320" fill="none" rx="8" stroke="#326895" stroke-width="2"/><path d="M302 156H309V178.4H302" fill="none" stroke="#326895" stroke-width="2"/><text x="323" y="177" font-size="23" fill="#326895" font-weight="700">56px</text><text x="323" y="207" font-size="20" fill="#52696a">위쪽 여백</text><rect x="78" y="306" width="188" height="58" fill="#fffefb" rx="0"/><text x="172" y="343" font-size="23" fill="#176b5c" font-weight="700" text-anchor="middle">시트 744px</text><text x="52" y="516" font-size="21" fill="#52696a">화면 맨 위에 붙지 않도록</text><text x="52" y="547" font-size="21" fill="#52696a">시트 높이를 56px 줄였습니다.</text><g clip-path="url(#partial)"><rect x="516" y="156" width="240" height="320" fill="#deeadb" rx="0"/><path d="M516 216L756 316M516 346L756 446M596 156L516 476M756 156L676 476" stroke="#f7f9f0" stroke-width="18"/><rect x="528" y="404" width="216" height="297.6" fill="#fffefb" rx="12" stroke="#176b5c" stroke-width="2"/><path d="M540 404H732Q744 404 744 416V476H528V416Q528 404 540 404Z" fill="#ffdfb2"/><rect x="614.0" y="416" width="44" height="4" fill="#92aaa0" rx="2"/><text x="544" y="452" font-size="22" fill="#193436" font-weight="700">주변 장소</text><path d="M528 476H744" stroke="#ad4b25" stroke-width="2"/><path d="M544 514H709" stroke="#bfcec4" stroke-width="6"/><path d="M544 550H684" stroke="#bfcec4" stroke-width="6"/><path d="M544 586H709" stroke="#bfcec4" stroke-width="6"/><path d="M544 622H684" stroke="#bfcec4" stroke-width="6"/><path d="M544 658H709" stroke="#bfcec4" stroke-width="6"/></g><rect x="516" y="156" width="240" height="320" fill="none" rx="8" stroke="#326895" stroke-width="2"/><path d="M506 476H768" stroke="#326895" stroke-width="2" stroke-dasharray="6 5"/><text x="538" y="391" font-size="20" fill="#176b5c">현재 시트 윗변</text><path d="M516 498.4H768" stroke="#52696a" stroke-width="2" stroke-dasharray="6 5"/><text x="516" y="540" font-size="20" fill="#52696a">닫혔을 때 시트 윗변</text><path d="M774 404H781V476H774" fill="none" stroke="#ad4b25" stroke-width="2"/><text x="800" y="446" font-size="23" fill="#ad4b25" font-weight="700">더 180px</text><path d="M774 476H781V498.4H774" fill="none" stroke="#326895" stroke-width="2"/><text x="800" y="496" font-size="22" fill="#326895" font-weight="700">먼저 56px</text><path d="M496 498.4V404m-6 8 6-8 6 8" fill="none" stroke="#176b5c" stroke-width="2"/><rect x="32" y="572" width="896" height="64" fill="#eaf3e7" rx="9"/><text x="480" y="613" font-size="26" fill="#176b5c" font-weight="700" text-anchor="middle">위쪽 여백 56 + 보여 줄 높이 180 = 스크롤 236px</text></g>
</svg>